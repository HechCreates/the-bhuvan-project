<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Edit the site — The Bhu.Van Project</title>
<!--
  The admin interface.

  It is the site, not a copy of it: the real published page loads in a frame
  and this page draws editing on top. Every element the build generated from a
  content file carries the field it came from, which is what lets a click on a
  paragraph become a change to a line in a YAML file.

  Nothing here knows the design. It reads data-edit, data-edit-src,
  data-edit-alt and data-item, and nothing else -- no class names, no layout
  -- so a change to the site cannot break it, and it cannot put anything
  anywhere the design did not already put it.
-->
<style>
  :root{
    --ink:#2A1F08; --paper:#F3EFE6; --bg:#E9E5D9; --line:rgba(42,31,8,.18);
    --clay:#B4703A; --clay-solid:#8F5628; --good:#3F7A4F; --bad:#B23A34;
    --ui:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--ui);color:var(--ink);background:var(--bg);
    display:flex;flex-direction:column;overflow:hidden}

  /* ---------- toolbar ---------- */
  .bar{display:flex;align-items:center;gap:.5rem;padding:.55rem .8rem;
    background:var(--ink);color:var(--paper);flex:none;z-index:3;flex-wrap:wrap}
  /* 11px floor: functional labels below it fail on small and high-DPI
     screens. .68rem was 10.88px. */
  .bar-label{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
  select,.btn{font:inherit;font-size:.82rem;border-radius:4px;
    border:1px solid rgba(243,239,230,.3);background:rgba(243,239,230,.1);
    color:var(--paper);padding:.42rem .7rem;cursor:pointer}
  /* the page picker: dark options, not the browser's grey-on-white default,
     which was unreadable */
  select{max-width:min(22rem,42vw)}
  select option{background:#241B06;color:#F3EFE6}
  .btn:hover:not(:disabled){background:rgba(243,239,230,.22)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-primary{background:var(--clay-solid);border-color:var(--clay-solid);font-weight:700}
  .btn-primary:hover:not(:disabled){background:#7A4820}
  .spacer{flex:1}
  /* the count IS the way into the list of changes -- one affordance where the
     number is, rather than a number here and a button somewhere else */
  .count{font:inherit;font-size:.78rem;color:var(--paper);background:transparent;
    border:1px solid rgba(243,239,230,.3);border-radius:4px;padding:.3rem .55rem;
    cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}
  .count:hover{background:rgba(243,239,230,.18)}
  .count[hidden]{display:none}
  .count .caret{font-size:.6rem;opacity:.8;transition:transform .15s}
  .count[aria-expanded="true"] .caret{transform:rotate(180deg)}
  .status{font-size:.78rem;padding:.25rem .6rem;border-radius:3px;display:none}
  .status.show{display:inline-block}
  .status.ok{background:var(--good);color:#fff}
  .status.err{background:var(--bad);color:#fff}
  .status.busy{background:rgba(243,239,230,.2)}

  /* ---------- the site ---------- */
  .stage{flex:1;position:relative;min-height:0}
  iframe{width:100%;height:100%;border:0;background:var(--paper);display:block}

  /* ---------- what am I pressing ---------- */
  .peek{position:absolute;left:0;right:0;bottom:0;z-index:2;pointer-events:none;
    background:rgba(36,27,6,.94);color:var(--paper);
    padding:.5rem .85rem;font-size:.78rem;line-height:1.35;
    display:flex;gap:.75rem;align-items:baseline;flex-wrap:wrap}
  .peek b{font-weight:700;letter-spacing:.02em}
  .peek code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;
    background:rgba(243,239,230,.14);padding:.1rem .35rem;border-radius:3px}
  .peek .hint{opacity:.72}

  /* ---------- the changes dropdown ----------
     Hangs under the count in the toolbar, where the number is. */
  .drawer{position:absolute;top:0;right:.8rem;width:min(420px,92vw);z-index:4;
    max-height:min(70vh,32rem);overflow:auto;padding:.9rem 1rem 1rem;
    background:var(--paper);border:1px solid var(--line);border-top:0;
    border-radius:0 0 8px 8px;box-shadow:0 14px 34px rgba(42,31,8,.28);display:none}
  .drawer.open{display:block}
  .drawer h2{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;margin:0 0 .8rem;opacity:.7}
  .chg{border-top:1px solid var(--line);padding:.6rem 0;font-size:.82rem}
  .chg .what{font-weight:700;display:block;padding-right:7rem}
  .chg code{font-size:.7rem;opacity:.7;display:block;margin-bottom:.25rem;word-break:break-all}
  .chg .was{text-decoration:line-through;opacity:.5}
  .chg .now{color:var(--clay-solid)}
  .chg .acts{float:right;display:flex;gap:.5rem}
  .chg .acts button{font:inherit;font-size:.72rem;background:none;border:0;
    cursor:pointer;text-decoration:underline;padding:0}
  .chg.structural{border-left:3px solid var(--clay-solid);padding-left:.5rem}
  .chg .acts .undo{color:var(--bad)}
  .chg .acts .pub{color:var(--good)}
  .chg .acts button:disabled{opacity:.45;cursor:not-allowed;text-decoration:none}
  .empty{opacity:.65;font-size:.84rem}

  /* ---------- sign in ---------- */
  .gate{position:fixed;inset:0;z-index:10;background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .gate.hide{display:none}
  .gate form{width:min(360px,100%)}
  .gate h2{font-size:1.5rem;margin:0 0 .3rem;font-weight:700}
  .gate p{font-size:.85rem;opacity:.75;margin:0 0 1.6rem;line-height:1.5}
  .gate label{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    opacity:.8;margin:0 0 .35rem}
  .gate input{width:100%;font:inherit;font-size:.95rem;padding:.6rem .7rem;margin:0 0 1rem;
    border-radius:4px;border:1px solid rgba(243,239,230,.32);
    background:rgba(243,239,230,.1);color:var(--paper)}
  .gate input:focus{outline:2px solid var(--clay);outline-offset:1px}
  .gate .btn-primary{width:100%;padding:.65rem;font-size:.9rem}
  .gate .err{background:var(--bad);color:#fff;padding:.5rem .7rem;border-radius:4px;
    font-size:.82rem;margin:0 0 1rem;display:none}
  .gate .err.show{display:block}
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="signin">
    <h2>The Bhu.Van Project</h2>
    <p>Sign in to edit the website. Changes go live about a minute after you publish them.</p>
    <div class="err" id="gate-err"></div>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary" id="gate-go">Sign in</button>
  </form>
</div>

<div class="bar">
  <span class="bar-label">Page</span>
  <select id="page" aria-label="Page to edit"></select>
  <button class="btn" id="undo" disabled>Undo</button>
  <div class="spacer"></div>
  <button type="button" class="count" id="count" aria-expanded="false" aria-controls="drawer" hidden>
    <span id="count-text"></span><span class="caret" aria-hidden="true">&#9660;</span>
  </button>
  <span class="status" id="status"></span>
  <button class="btn" id="discard" disabled>Discard all</button>
  <button class="btn btn-primary" id="save" disabled>Publish</button>
</div>

<div class="stage">
  <iframe id="site" title="The site"></iframe>
  <div class="peek" id="peek">
    <b id="peek-what">Loading the page…</b>
    <span class="hint" id="peek-hint"></span>
    <code id="peek-path" hidden></code>
  </div>
  <aside class="drawer" id="drawer" aria-label="Unsaved changes">
    <h2>Unsaved changes</h2>
    <div id="changes"><p class="empty">Nothing changed yet.</p></div>
  </aside>
</div>

<script>
(function () {
  'use strict';

  var LOCAL = /^(127\.0\.0\.1|localhost)$/.test(location.hostname);
  var SERVICE = 'https://bhuvan-admin.hechcreates.deno.net';
  var SAVE_URL = LOCAL ? location.origin + '/__save' : SERVICE + '/save';
  var LOGIN_URL = SERVICE + '/login';
  var token = LOCAL ? 'local' : (sessionStorage.getItem('bhuvan-token') || '');

  var PAGES = [
    { label: 'Home', url: '../', scope: 'home' },
    { label: 'About', url: '../about/', scope: 'about' },
    { label: 'Visual Journey', url: '../visual-journey/', scope: 'journey' },
    { label: 'Projects (the index page)', url: '../projects/', scope: 'projects' },
    { label: 'Testimonials', url: '../testimonials/', scope: 'testimonials' },
    { label: 'FAQ', url: '../faq/', scope: 'faq' },
    { label: 'Contact', url: '../contact/', scope: 'contact' },
    { label: 'Project — Bandipur (Junglescapes)', url: '../projects/hydro-ecological-restoration-bandipur/', scope: 'projects/bandipur-tiger-reserve' },
    { label: 'Project — Bandipur (Rewilding Earth)', url: '../projects/wildlife-habitat-restoration-bandipur/', scope: 'projects/ecological-restoration' },
    { label: 'Project — Mysuru Rail Museum', url: '../projects/mysuru-rail-museum/', scope: 'projects/mysuru-rail-museum' },
    { label: 'Project — Nilgiris tea estate', url: '../projects/tea-estate-watershed-nilgiris/', scope: 'projects/nilgiris-biosphere-reserve' },
    { label: "Project — Chairman's Bungalow", url: '../projects/chairmans-bungalow-nilgiris/', scope: 'projects/chairmans-bungalow' },
    { label: 'Project — Karavulapalli farm', url: '../projects/regenerative-farm-karavulapalli/', scope: 'projects/karavulapalli-farm' },
    { label: 'Project — Context-Responsive Design', url: '../projects/context-responsive-design/', scope: 'projects/context-responsive-design' }
  ];

  var el = {};
  ['page', 'site', 'save', 'discard', 'undo', 'drawer', 'changes', 'count', 'count-text',
   'status', 'peek', 'peek-what', 'peek-hint', 'peek-path'].forEach(function (id) {
    el[id.replace(/-(\w)/g, function (m, c) { return c.toUpperCase(); })] = document.getElementById(id);
  });

  var pending = {}, order = [], images = {};
  var scope = '';

  /* Editing the same field twice should leave ONE change, so a change is
     keyed by the field it writes. But adding or removing an item renumbers
     every item after it, so "faq.items.5.q" before an insert and
     "faq.items.5.q" after it are two different questions. The epoch counts
     the adds and removes, and belongs to the key -- which keeps the earlier
     edit from being silently swallowed by the later one. */
  var epoch = 0;

  function key(s, p) { return epoch + '|' + s + ':' + p; }

  function record(s, p, was, now, image) {
    var k = key(s, p);
    if (order.indexOf(k) < 0) order.push(k);
    if (was === now && !image) {
      delete pending[k];
      order = order.filter(function (x) { return x !== k; });
    } else {
      pending[k] = { scope: s, path: p, was: was, now: now, image: image || null };
    }
    paint();
  }

  /* Adding and removing are recorded whole rather than as a set of field
     changes: the server copies the item it was pressed on, so the fields the
     editor never marked -- a testimonial's silhouette framing, a card's
     width and height -- come along without the editor having to know they
     exist. `values` carries what IS marked, so a copy taken after an unsaved
     edit says what the screen said. */
  function structural(s, op, path, values, label) {
    var k = key(s, '!' + op + ':' + path);
    order.push(k);
    pending[k] = { scope: s, path: path, op: op, values: values || null, label: label, was: '', now: '' };
    epoch++;
    paint();
  }

  function isStructural(c) { return c.op === 'insert' || c.op === 'remove'; }

  function liveCount() { return order.filter(function (k) { return pending[k]; }).length; }

  function paint() {
    var n = liveCount();
    el.countText.textContent = n ? (n + (n === 1 ? ' change' : ' changes')) : '';
    el.count.hidden = !n;
    el.save.disabled = el.discard.disabled = el.undo.disabled = !n;
    if (!n) openDrawer(false);

    if (!n) { el.changes.innerHTML = '<p class="empty">Nothing changed yet.</p>'; return; }
    el.changes.innerHTML = '';
    /* Once an add or a remove is waiting, everything below it is numbered
       from the list that change makes -- so it cannot go to the site first. */
    var blocked = false;
    order.forEach(function (k) {
      var c = pending[k];
      if (!c) return;
      var d = document.createElement('div');
      d.className = 'chg' + (isStructural(c) ? ' structural' : '');

      var acts = document.createElement('div');
      acts.className = 'acts';
      /* Publishing one change is the same request as publishing all of them,
         with one entry in it -- so there is only one code path that writes. */
      var pub = action('pub', 'publish', function () { publish([k]); });
      if (blocked) {
        pub.disabled = true;
        pub.title = 'Publish the add or remove above this one first: this change counts from it.';
      }
      acts.appendChild(pub);
      var undo = action('undo', 'undo', function () { revert(k); });
      var after = order.slice(order.indexOf(k) + 1).filter(function (x) { return pending[x]; }).length;
      if (after) undo.title = 'Undoes this and the ' + after + ' change' + (after === 1 ? '' : 's') + ' after it.';
      acts.appendChild(undo);
      d.appendChild(acts);

      var what = document.createElement('span');
      what.className = 'what';
      what.textContent = c.label || capitalise(friendly(c.path));
      d.appendChild(what);

      var code = document.createElement('code');
      code.textContent = c.path;
      d.appendChild(code);

      if (isStructural(c)) {
        var note = document.createElement('div');
        note.className = 'now';
        note.textContent = c.op === 'insert'
          ? 'a copy, to edit — everything after it moves down one'
          : 'everything after it moves up one';
        d.appendChild(note);
      } else {
        var was = document.createElement('div');
        was.className = 'was';
        was.textContent = plain(c.was) || '(empty)';
        var now = document.createElement('div');
        now.className = 'now';
        now.textContent = c.image ? ('new photograph: ' + c.image.filename) : (plain(c.now) || '(empty)');
        d.appendChild(was); d.appendChild(now);
      }

      el.changes.appendChild(d);
      if (isStructural(c)) blocked = true;
    });

    /* the bar along the bottom counts the unsaved changes too, and saying
       "1 unsaved" while the drawer lists three is exactly the kind of thing
       that makes a tool feel untrustworthy */
    if (!hovering) peek(null);
  }

  function action(cls, label, fn) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = cls;
    b.textContent = label;
    b.onclick = fn;
    return b;
  }

  function openDrawer(open) {
    el.drawer.classList.toggle('open', open);
    el.count.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function plain(v) { return String(v == null ? '' : v).replace(/<[^>]*>/g, '').trim().slice(0, 140); }

  /* Undo is a stack, not a pick-and-choose.
   *
   * Adding or removing an item renumbers every item after it, so a change
   * made afterwards is described in terms of the list that change created.
   * Undoing it and keeping the later ones would leave those later ones
   * pointing at rows that had moved -- an edit landing on the wrong
   * testimonial, which is the kind of mistake nobody would spot until it was
   * published. So undoing a change undoes everything made after it too, and
   * says how many that was.
   *
   * Publishing, unlike undoing, can still take one change on its own -- as
   * long as no add or remove sits above it. paint() disables the ones where
   * it does.
   */
  function revert(k) {
    if (!pending[k]) return;
    var from = order.indexOf(k);
    var dropped = order.slice(from).filter(function (x) { return pending[x]; });

    dropped.forEach(function (x) {
      if (pending[x].image) delete images[pending[x].image.id];
      delete pending[x];
    });
    order = order.slice(0, from);

    paint();
    reload();               // the stored page, with whatever is left replayed on top
    if (dropped.length > 1) setStatus('undid ' + dropped.length + ' changes', 'ok');
  }

  function setStatus(text, kind) {
    el.status.textContent = text;
    el.status.className = 'status show ' + (kind || 'busy');
    if (kind === 'ok') setTimeout(function () { el.status.className = 'status'; }, 5000);
  }

  /* ---------- naming things, so you can see what you are pressing ----------
     A field path like "philo.philo-body-p.1" is accurate but not friendly.
     This turns it into "Who we are — paragraph 2". */
  var WORDS = {
    'p': 'paragraph', 'h1': 'heading', 'h2': 'heading', 'h3': 'heading',
    'sec-title': 'section heading', 'proj-title': 'project title',
    'proj-sub': 'project subtitle', 'plate-title': 'card title',
    'plate-sub': 'card subtitle', 'pi-title': 'card title', 'pi-sub': 'card subtitle',
    'lead-name': 'name', 'lead-role': 'role', 'member-name': 'name', 'member-role': 'role',
    'tq-name': 'name', 'tq-role': 'role', 'tq-lede': 'testimonial',
    'faq-q': 'question', 'faq-a': 'answer', 'vj-title': 'category name',
    'about-statement': 'statement', 'hero-statement': 'headline', 'hero-lede': 'standfirst',
    'meaning-text': 'the Sanskrit line', 'label': 'small label', 'about-cap': 'caption',
    'practice-name': 'practice name', 'practice-desc': 'practice description',
    'body': 'paragraph', 'caption': 'caption', 'alt': 'description for screen readers',
    'image': 'photograph', 'src': 'photograph', 'file': 'photograph', 'title': 'title',
    /* the lists that can be added to and removed from */
    'faq': 'FAQ', 'items': 'entry', 'q': 'question', 'a': 'answer',
    'work': 'projects', 'cards': 'card', 'subtitle': 'subtitle', 'index': 'number',
    'tst': 'testimonial', 'lede': 'summary line', 'more': 'read-more label',
    'silImage': 'silhouette', 'silAlt': 'silhouette description',
    'hero': 'hero', 'tags': 'tag', 'plates': 'card', 'logos': 'logo',
    'members': 'member', 'team': 'team', 'collaborators': 'collaborators'
  };

  function friendly(path) {
    var parts = String(path).split('.');
    var words = [];
    parts.forEach(function (part) {
      if (/^\d+$/.test(part)) { words.push('#' + (Number(part) + 1)); return; }
      words.push(WORDS[part] || part.replace(/-/g, ' '));
    });
    /* "philo paragraph #2" reads better than the raw path and still says
       exactly which one */
    return words.join(' ');
  }

  function describe(node) {
    if (!node) return null;
    if (node.hasAttribute('data-edit-src')) {
      return { what: 'Photograph', hint: 'Click to replace it. Drag onto another photograph to swap them.',
               path: node.getAttribute('data-edit-src') };
    }
    if (node.hasAttribute('data-edit')) {
      var p = node.getAttribute('data-edit');
      return { what: capitalise(friendly(p)), hint: 'Click to edit. Enter saves, Escape cancels.', path: p };
    }
    return null;
  }

  function capitalise(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  var hovering = false;

  function peek(info) {
    hovering = Boolean(info);
    if (!info) {
      var n = liveCount();
      el.peekWhat.textContent = countEditable() + ' things you can change on this page';
      el.peekHint.textContent = n ? (n + ' unsaved — press Publish when you are ready') :
        'Hover anything to see what it is. Photographs can be dragged to swap.';
      el.peekPath.hidden = true;
      return;
    }
    el.peekWhat.textContent = info.what;
    el.peekHint.textContent = info.hint;
    el.peekPath.textContent = info.path;
    el.peekPath.hidden = false;
  }

  function countEditable() {
    var d = el.site.contentDocument;
    return d ? d.querySelectorAll('[data-edit],[data-edit-src]').length : 0;
  }

  /* ---------- the editing layer ---------- */
  function attach() {
    var doc = el.site.contentDocument;
    if (!doc) return;
    scope = el.page.options[el.page.selectedIndex].dataset.scope;

    var style = doc.createElement('style');
    style.textContent =
      '[data-edit],[data-edit-src]{outline:1px dashed rgba(180,112,58,.5);outline-offset:2px;' +
        'transition:outline-color .12s}' +
      '[data-edit]{cursor:text}' +
      '[data-edit-src]{cursor:grab}' +
      '[data-edit]:hover,[data-edit-src]:hover{outline:2px solid #B4703A}' +
      '[contenteditable="true"]{outline:2px solid #B4703A !important;background:rgba(180,112,58,.1)}' +
      '.bhv-edited{outline:2px solid #3F7A4F !important}' +
      '.bhv-drag{opacity:.4}' +
      '.bhv-target{outline:3px solid #3F7A4F !important;outline-offset:3px}' +
      '[data-item]{position:relative}' +
      '.bhv-tools{position:absolute;top:2px;left:2px;z-index:9;display:flex;gap:2px;' +
        'background:#241B06;border-radius:4px;padding:2px;opacity:0;transition:opacity .12s}' +
      '[data-item]:hover .bhv-tools{opacity:1}' +
      '.bhv-tools button{font:600 13px/1 system-ui;color:#F3EFE6;background:transparent;' +
        'border:0;padding:5px 8px;cursor:pointer;border-radius:3px}' +
      '.bhv-tools button:hover{background:#8F5628}' +
      /* removing is the one that cannot be pressed by accident and shrugged
         off, so it is the one that looks different */
      '.bhv-tools button:last-child:hover{background:#B23A34}';
    doc.head.appendChild(style);

    wire(doc);

    /* links would navigate away from the page being edited */
    doc.addEventListener('click', function (e) {
      openDrawer(false);          // a click in the frame does not reach this document
      var a = e.target.closest && e.target.closest('a[href]');
      if (a && !a.hasAttribute('data-edit')) e.preventDefault();
    }, true);

    doc.addEventListener('mouseover', function (e) {
      if (!e.target.closest) return;
      /* the tool bar first: its buttons sit INSIDE an item, so the item
         would otherwise answer for them and the bar would name the wrong
         thing -- the whole point of the bar is that it says what you are
         about to press */
      var tool = e.target.closest('[data-peek]');
      if (tool) {
        var owner = tool.closest('[data-item]');
        return peek({ what: tool.getAttribute('data-peek'), hint: '',
                      path: owner ? owner.getAttribute('data-item') : '' });
      }
      peek(describe(e.target.closest('[data-edit],[data-edit-src]')));
    });
    doc.addEventListener('mouseleave', function () { peek(null); });

    replay();
    peek(null);
  }

  /* Everything editable inside `root`, and `root` itself if it is editable.
     Called once for the whole document on load, and again for each copy an
     editor adds -- cloneNode copies markup, never the listeners on it. */
  function wire(root) {
    var self = root.matches ? root : null;
    if (self && root.matches('[data-edit]')) wireText(root);
    if (self && root.matches('[data-edit-src]')) wireImage(root);
    root.querySelectorAll('[data-edit]').forEach(wireText);
    root.querySelectorAll('[data-edit-src]').forEach(wireImage);
    if (self && root.matches('[data-item]')) wireItem(root);
    root.querySelectorAll('[data-item]').forEach(wireItem);
  }

  function wireText(node) {
    node.addEventListener('click', function (e) {
      if (node.getAttribute('contenteditable') === 'true') return;
      e.preventDefault(); e.stopPropagation();
      node.dataset.bhvWas = node.innerHTML;
      node.setAttribute('contenteditable', 'true');
      node.focus();
      peek(describe(node));
    });
    node.addEventListener('blur', function () {
      if (node.getAttribute('contenteditable') !== 'true') return;
      node.removeAttribute('contenteditable');
      var was = node.dataset.bhvWas, now = node.innerHTML.trim();
      if (now !== was) node.classList.add('bhv-edited');
      /* read the field NOW, not when this element was wired. Moving an item,
         or adding one above it, renames every field below -- and a path read
         once at wiring would still be the old name, so the edit landed on
         whichever item had taken this one's place. */
      record(scope, node.getAttribute('data-edit'), was, now);
    });
    node.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); node.blur(); }
      if (e.key === 'Escape') { node.innerHTML = node.dataset.bhvWas; node.blur(); }
    });
  }

  /* ---------- photographs: replace, or drag one onto another to swap ------- */
  var dragging = null;

  function wireImage(img) {
    img.setAttribute('draggable', 'true');

    img.addEventListener('click', function (e) {
      e.preventDefault(); e.stopPropagation();
      pickImage(img);
    });

    img.addEventListener('dragstart', function (e) {
      dragging = img;
      img.classList.add('bhv-drag');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', img.getAttribute('data-edit-src')); } catch (err) {}
    });
    img.addEventListener('dragend', function () {
      img.classList.remove('bhv-drag');
      var d = el.site.contentDocument;
      if (d) d.querySelectorAll('.bhv-target').forEach(function (n) { n.classList.remove('bhv-target'); });
      dragging = null;
    });
    img.addEventListener('dragover', function (e) {
      if (!dragging || dragging === img) return;
      e.preventDefault();
      img.classList.add('bhv-target');
    });
    img.addEventListener('dragleave', function () { img.classList.remove('bhv-target'); });
    img.addEventListener('drop', function (e) {
      e.preventDefault();
      img.classList.remove('bhv-target');
      if (!dragging || dragging === img) return;
      swap(dragging, img);
    });
  }

  /* Swapping writes each photograph's filename into the other's field, so two
     changes are recorded and either can be undone on its own. */
  function swap(a, b) {
    var pa = a.getAttribute('data-edit-src'), pb = b.getAttribute('data-edit-src');
    var fa = fileOf(a), fb = fileOf(b);
    if (!pa || !pb || fa === fb) return;

    record(scope, pa, fa, fb);
    record(scope, pb, fb, fa);

    /* the description belongs to the photograph, so it travels with it */
    var aa = a.getAttribute('data-edit-alt'), ab = b.getAttribute('data-edit-alt');
    if (aa && ab) {
      var ta = a.getAttribute('alt') || '', tb = b.getAttribute('alt') || '';
      record(scope, aa, ta, tb);
      record(scope, ab, tb, ta);
      a.setAttribute('alt', tb); b.setAttribute('alt', ta);
    }

    var tmp = a.getAttribute('src');
    a.setAttribute('src', b.getAttribute('src'));
    b.setAttribute('src', tmp);
    a.classList.add('bhv-edited'); b.classList.add('bhv-edited');
    setStatus('swapped — press Publish to keep it', 'ok');
  }

  /* the value stored in the content file, which is the path without the ../
     the build adds for pages below the root */
  function fileOf(img) {
    return (img.getAttribute('src') || '').replace(/^(\.\.\/)+/, '');
  }

  var picker = document.createElement('input');
  picker.type = 'file';
  picker.accept = 'image/*';

  function pickImage(node) {
    var path = node.getAttribute('data-edit-src');
    picker.value = '';
    picker.onchange = function () {
      var file = picker.files && picker.files[0];
      if (!file) return;
      setStatus('preparing photograph…');
      toWebp(file, function (out) {
        var current = fileOf(node);
        var dir = current.slice(0, current.lastIndexOf('/')) || 'images';
        var base = file.name.replace(/\.[^.]+$/, '').toLowerCase()
          .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'photograph';
        var name = base + '-' + Date.now().toString(36) + '.webp';
        images[dir + '/' + name] = { dir: dir, filename: name, base64: out.base64 };
        node.src = out.dataUrl;
        node.classList.add('bhv-edited');
        record(scope, path, current, dir + '/' + name, { id: dir + '/' + name, filename: name });
        setStatus('photograph ready — press Publish', 'ok');
      });
    };
    picker.click();
  }

  /* Resized and converted in the browser, so a 6 MB phone photograph does not
     become a 6 MB file in the repository. */
  function toWebp(file, done) {
    var img = new Image();
    img.onload = function () {
      var max = 2000, w = img.naturalWidth, h = img.naturalHeight;
      if (w > max || h > max) { var s = Math.min(max / w, max / h); w = Math.round(w * s); h = Math.round(h * s); }
      var c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      var dataUrl = c.toDataURL('image/webp', 0.82);
      done({ dataUrl: dataUrl, base64: dataUrl.split(',')[1] });
    };
    img.src = URL.createObjectURL(file);
  }

  /* ---------- items in a list: move, add, remove ----------
     Only lists declare data-item, because only a list can be added to or
     reordered without inventing a layout the design does not have. */
  function wireItem(node) {
    var doc = el.site.contentDocument;
    if (node.querySelector(':scope > .bhv-tools')) return;   // a clone brings one with it
    var tools = doc.createElement('div');
    tools.className = 'bhv-tools';
    tools.setAttribute('contenteditable', 'false');

    [['←', 'Move earlier', function () { move(node, -1); }],
     ['→', 'Move later', function () { move(node, 1); }],
     ['+', 'Add a copy of this one after it', function () { addCopy(node); }],
     ['−', 'Remove this one', function () { removeItem(node); }]
    ].forEach(function (spec) {
      var b = doc.createElement('button');
      b.type = 'button';
      b.textContent = spec[0];
      b.title = spec[1];
      /* the hover bar names it too: a title attribute takes a second to
         appear and this is the tool bar someone said they could not read */
      b.setAttribute('data-peek', spec[1]);
      b.onclick = function (e) { e.preventDefault(); e.stopPropagation(); spec[2](); };
      tools.appendChild(b);
    });
    node.appendChild(tools);
  }

  /* ---------- keeping the page's paths and its order in step ----------
     Every item's fields are named by its position -- "faq.items.3.q" -- so
     the moment the order changes, or an item appears or disappears, the
     names on the page are stale. renumber() walks the list in the order it
     is now ON SCREEN and gives each item the name of the place it occupies.
     Without it, moving an item and then editing it wrote the edit into the
     item it had traded places with. */
  var PATH_ATTRS = ['data-item', 'data-edit', 'data-edit-src', 'data-edit-alt'];

  function rebase(node, from, to) {
    if (from === to) return;
    var nodes = [node].concat(Array.prototype.slice.call(
      node.querySelectorAll('[data-item],[data-edit],[data-edit-src],[data-edit-alt]')));
    nodes.forEach(function (n) {
      PATH_ATTRS.forEach(function (a) {
        var v = n.getAttribute(a);
        if (v === from) n.setAttribute(a, to);
        else if (v && v.indexOf(from + '.') === 0) n.setAttribute(a, to + v.slice(from.length));
      });
    });
  }

  /* The items of the list this one belongs to, in screen order. Siblings
     only, and only those in the SAME list: two lists can sit in one parent. */
  function listOf(node) {
    var base = node.getAttribute('data-item');
    var prefix = base.slice(0, base.lastIndexOf('.'));
    var items = Array.prototype.filter.call(node.parentNode.children, function (n) {
      var p = n.getAttribute && n.getAttribute('data-item');
      return p && p.slice(0, p.lastIndexOf('.')) === prefix;
    });
    return { prefix: prefix, items: items, at: items.indexOf(node) };
  }

  function renumber(list) {
    list.items.forEach(function (n, i) {
      rebase(n, n.getAttribute('data-item'), list.prefix + '.' + i);
    });
  }

  /* A copy carries its original's ids, and two elements with one id means
     the copy's "read the full testimonial" button expands the original.
     Only in the preview -- the published page is numbered by the template --
     but it looks broken, so the copy gets its own. */
  function freshIds(clone) {
    var stamp = Date.now().toString(36);
    Array.prototype.slice.call(clone.querySelectorAll('[id]')).forEach(function (n) {
      var was = n.id, now = was + '-' + stamp;
      Array.prototype.slice.call(clone.querySelectorAll(
        '[aria-controls="' + was + '"],[for="' + was + '"],[href="#' + was + '"]'
      )).forEach(function (r) {
        if (r.getAttribute('aria-controls') === was) r.setAttribute('aria-controls', now);
        if (r.getAttribute('for') === was) r.setAttribute('for', now);
        if (r.getAttribute('href') === '#' + was) r.setAttribute('href', '#' + now);
      });
      n.id = now;
    });
  }

  /* The two halves are kept apart on purpose. insertDom/removeDom change
     what is on the screen and nothing else, so replay() can put the screen
     back together after a reload without recording the same change twice. */
  function insertDom(node, values) {
    var clone = node.cloneNode(true);
    /* the original's tool bar comes across as markup with no listeners on
       it; wire() puts a live one back */
    Array.prototype.slice.call(clone.querySelectorAll('.bhv-tools')).forEach(function (t) { t.remove(); });
    freshIds(clone);
    node.parentNode.insertBefore(clone, node.nextSibling);
    renumber(listOf(clone));
    wire(clone);
    clone.classList.add('bhv-edited');
    if (values) {
      var base = clone.getAttribute('data-item');
      Object.keys(values).forEach(function (f) { putField(clone, base + '.' + f, values[f]); });
    }
    return clone;
  }

  function removeDom(node) {
    var list = listOf(node);
    var parent = node.parentNode;
    node.remove();
    var rest = Array.prototype.filter.call(parent.children, function (n) {
      var p = n.getAttribute && n.getAttribute('data-item');
      return p && p.slice(0, p.lastIndexOf('.')) === list.prefix;
    });
    renumber({ prefix: list.prefix, items: rest });
  }

  function addCopy(node) {
    var base = node.getAttribute('data-item');
    /* recorded BEFORE the page is renumbered: the index in the change is the
       one the list has now, which is the one the server will splice into */
    structural(scope, 'insert', base, fieldsOf(node, base), 'Added a copy of ' + friendly(base));
    insertDom(node, null).scrollIntoView({ block: 'center', behavior: 'smooth' });
    setStatus('copy added — edit it, then press Publish', 'ok');
  }

  function removeItem(node) {
    if (listOf(node).items.length <= 1) {
      setStatus('this is the last one; removing it would leave the section empty', 'err');
      return;
    }
    var base = node.getAttribute('data-item');
    if (!confirm('Remove ' + friendly(base) + '? You can undo it before publishing.')) return;
    structural(scope, 'remove', base, null, 'Removed ' + friendly(base));
    removeDom(node);
    setStatus('removed — press Publish to keep it, or Undo', 'ok');
  }

  /* ---------- putting a value back on the page ----------
     One field, wherever it lives: the words of a paragraph, the file a
     photograph points at, or the description that travels with it. */
  function putField(root, path, value) {
    var sel = '[data-edit="' + path + '"],[data-edit-src="' + path + '"],[data-edit-alt="' + path + '"]';
    var n = (root.matches && root.matches(sel)) ? root : root.querySelector(sel);
    if (!n) return false;

    if (n.getAttribute('data-edit') === path) n.innerHTML = value;
    else if (n.getAttribute('data-edit-alt') === path) n.setAttribute('alt', value);
    else {
      /* a photograph waiting to be published has no file on the server yet,
         so the picture to show is the one still in the browser */
      var held = images[value];
      var prefix = (n.getAttribute('src').match(/^(\.\.\/)*/) || [''])[0];
      n.setAttribute('src', held ? 'data:image/webp;base64,' + held.base64 : prefix + value);
    }
    n.classList.add('bhv-edited');
    return true;
  }

  /* After the frame reloads it shows what is STORED. Everything still
     waiting to be published is put back on top, in the order it was made, so
     the page and the list of changes never disagree -- which matters most
     for an added item, which would otherwise vanish from the screen while
     still being queued to appear on the site. */
  function replay() {
    var doc = el.site.contentDocument;
    if (!doc) return;
    order.forEach(function (k) {
      var c = pending[k];
      if (!c) return;
      if (isStructural(c)) {
        var node = doc.querySelector('[data-item="' + c.path + '"]');
        if (!node) return;
        if (c.op === 'insert') insertDom(node, c.values);
        else removeDom(node);
      } else {
        putField(doc.documentElement, c.path, c.now);
      }
    });
  }

  /* Reordering is expressed as a set of field changes -- item A takes item
     B's values and the other way round -- so it travels through exactly the
     same save path as editing a word, and needs nothing new on the server. */
  function move(node, delta) {
    var siblings = Array.prototype.filter.call(
      node.parentNode.children, function (n) { return n.hasAttribute && n.hasAttribute('data-item'); });
    var i = siblings.indexOf(node);
    var j = i + delta;
    if (i < 0 || j < 0 || j >= siblings.length) return;

    var other = siblings[j];
    var pa = node.getAttribute('data-item'), pb = other.getAttribute('data-item');

    /* every field of the two items trades places */
    var fieldsA = fieldsOf(node, pa), fieldsB = fieldsOf(other, pb);
    var names = Object.keys(fieldsA).filter(function (k) { return k in fieldsB; });
    if (!names.length) return;
    names.forEach(function (name) {
      record(scope, pa + '.' + name, fieldsA[name], fieldsB[name]);
      record(scope, pb + '.' + name, fieldsB[name], fieldsA[name]);
    });

    /* show it immediately by moving the element */
    if (delta < 0) other.parentNode.insertBefore(node, other);
    else other.parentNode.insertBefore(other, node);

    /* and give both items the name of the place they now occupy. The values
       above were recorded against the OLD names, which is why that happens
       first. Without this the element kept the name of where it used to be,
       so editing an item after moving it wrote the edit into the item it had
       traded places with. */
    renumber(listOf(node));

    node.classList.add('bhv-edited');
    setStatus('moved — press Publish to keep it', 'ok');
  }

  /* Every field of an item, including an image's alt text. Leaving alt out
     meant a reorder moved the photographs but not their descriptions, so a
     logo ended up showing one company and telling a screen reader another. */
  function fieldsOf(item, base) {
    var out = {};
    var under = function (p) { return p && p.indexOf(base + '.') === 0; };

    item.querySelectorAll('[data-edit],[data-edit-src],[data-edit-alt]').forEach(function (n) {
      var src = n.getAttribute('data-edit-src');
      if (under(src)) out[src.slice(base.length + 1)] = fileOf(n);

      var alt = n.getAttribute('data-edit-alt');
      if (under(alt)) out[alt.slice(base.length + 1)] = n.getAttribute('alt') || '';

      var text = n.getAttribute('data-edit');
      if (under(text)) out[text.slice(base.length + 1)] = n.innerHTML.trim();
    });
    return out;
  }

  /* ---------- saving ----------
     One request shape, whether it carries every change or just the one whose
     "publish" was pressed. Anything not in `keys` stays pending and keeps
     showing on the page, so the frame must NOT be reloaded unless the list
     is now empty -- a reload would throw away the edits still waiting. */
  function publish(keys) {
    var live = order.filter(function (k) { return pending[k]; });
    var take = keys ? live.filter(function (k) { return keys.indexOf(k) >= 0; }) : live;
    if (!take.length) return;

    var changes = take.map(function (k) {
      var c = pending[k];
      return isStructural(c)
        ? { scope: c.scope, path: c.path, op: c.op, values: c.values }
        : { scope: c.scope, path: c.path, value: c.now };
    });
    /* Only the photographs these changes actually point at -- including the
       ones an added copy carries, which would otherwise be a filename in a
       content file with no file behind it. */
    var imgs = [], seen = {};
    take.forEach(function (k) {
      var c = pending[k], ids = [];
      if (c.image) ids.push(c.image.id);
      if (c.values) Object.keys(c.values).forEach(function (f) { ids.push(c.values[f]); });
      ids.forEach(function (id) {
        if (images[id] && !seen[id]) { seen[id] = 1; imgs.push(images[id]); }
      });
    });

    el.save.disabled = true;
    Array.prototype.forEach.call(el.changes.querySelectorAll('button'), function (b) { b.disabled = true; });
    setStatus(LOCAL ? 'publishing…' : 'publishing… live in about a minute');

    var headers = { 'Content-Type': 'application/json' };
    if (!LOCAL) headers.Authorization = 'Bearer ' + token;

    fetch(SAVE_URL, { method: 'POST', headers: headers,
      body: JSON.stringify({ changes: changes, images: imgs }) })
      .then(function (r) {
        if (r.status === 401) { signOut('Your session expired. Sign in again.'); throw new Error('signed out'); }
        return r.json().catch(function () { return { ok: false, error: 'the service sent something unreadable' }; });
      })
      .then(function (out) {
        if (!out.ok) throw new Error(out.error || 'refused');
        take.forEach(function (k) {
          var c = pending[k];
          if (c && c.image) delete images[c.image.id];
          delete pending[k];
        });
        order = order.filter(function (k) { return pending[k]; });
        paint();
        var left = liveCount();
        setStatus((LOCAL ? 'published' : 'published — live in about a minute')
          + (left ? ' (' + left + ' still unpublished)' : ''), 'ok');
        if (LOCAL && !left) reload();
      })
      .catch(function (e) {
        if (e.message === 'signed out') return;
        setStatus('not saved: ' + e.message, 'err');
        paint();
      });
  }

  el.save.onclick = function () { publish(null); };

  el.discard.onclick = function () {
    if (!confirm('Throw away every unsaved change on this page?')) return;
    pending = {}; order = []; images = {};
    paint(); reload();
  };

  el.undo.onclick = function () {
    for (var i = order.length - 1; i >= 0; i--) if (pending[order[i]]) return revert(order[i]);
  };

  el.count.onclick = function (e) {
    e.stopPropagation();
    openDrawer(!el.drawer.classList.contains('open'));
  };
  document.addEventListener('click', function (e) {
    if (!el.drawer.contains(e.target)) openDrawer(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') openDrawer(false);
  });

  function reload() { el.site.contentWindow.location.reload(); }

  /* ---------- signing in ---------- */
  var gate = document.getElementById('gate');
  var gateErr = document.getElementById('gate-err');
  var gateGo = document.getElementById('gate-go');

  function signOut(why) {
    token = '';
    sessionStorage.removeItem('bhuvan-token');
    gate.classList.remove('hide');
    if (why) { gateErr.textContent = why; gateErr.classList.add('show'); }
  }

  document.getElementById('signin').onsubmit = function (e) {
    e.preventDefault();
    gateErr.classList.remove('show');
    gateGo.disabled = true; gateGo.textContent = 'Signing in…';
    fetch(LOGIN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value,
                             password: document.getElementById('password').value }) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, error: 'the service is not reachable' }; }); })
      .then(function (out) {
        if (!out.ok) throw new Error(out.error || 'that did not work');
        token = out.token;
        sessionStorage.setItem('bhuvan-token', token);
        document.getElementById('password').value = '';
        gate.classList.add('hide');
      })
      .catch(function (err) { gateErr.textContent = err.message; gateErr.classList.add('show'); })
      .finally(function () { gateGo.disabled = false; gateGo.textContent = 'Sign in'; });
  };

  if (token) gate.classList.add('hide');

  /* ---------- pages ---------- */
  PAGES.forEach(function (p) {
    var o = document.createElement('option');
    o.value = p.url; o.textContent = p.label; o.dataset.scope = p.scope;
    el.page.appendChild(o);
  });

  el.page.onchange = function () {
    if (liveCount() && !confirm('You have unsaved changes on this page. Leave and lose them?')) return;
    pending = {}; order = []; images = {};
    paint();
    el.site.src = el.page.value;
  };

  el.site.addEventListener('load', attach);
  el.site.src = PAGES[0].url;

  window.addEventListener('beforeunload', function (e) {
    if (liveCount()) { e.preventDefault(); e.returnValue = ''; }
  });
})();
</script>
</body>
</html>
