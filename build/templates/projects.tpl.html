<div data-page="projects" class="project-page projects-index">
<header class="site-header" data-header></header>
  <section class="pi-open">
    <div class="wrap">
      <figure class="pi-quote">
        <blockquote data-edit="pi-open.blockquote.0">{{pi-open.blockquote.0}}</blockquote>
        <figcaption data-edit="pi-open.figcaption.0">{{pi-open.figcaption.0}}</figcaption>
      </figure>
    </div>
  </section>
  <section class="pi-work" aria-label="Projects">
    <div class="wrap">
      <div class="sec-head pi-head">
        <h1 class="sec-title" data-edit="pi-work.sec-title.0">{{pi-work.sec-title.0}}</h1>
      </div>
      <div class="pi-grid">{{#each work.cards}}
      <article class="pi-card" data-item="work.cards.{{@i}}">
        <a class="pi-link" href="#/projects/{{slug}}" data-route="p-{{slug}}">
          <span class="pi-index" data-edit="work.cards.{{@i}}.index">{{index}}</span>
          <div class="pi-media">
            <img src="{{image}}" width="{{width}}" height="{{height}}" loading="lazy" decoding="async"
                 alt="{{alt}}" data-edit-src="work.cards.{{@i}}.image" data-edit-alt="work.cards.{{@i}}.alt">
          </div>
          <h2 class="pi-title" data-edit="work.cards.{{@i}}.title">{{title}}</h2>
          <p class="pi-sub" data-edit="work.cards.{{@i}}.subtitle">{{subtitle}}</p>
          <span class="pi-cue">{{cue}}<span aria-hidden="true">&rarr;</span></span>
        </a>
      </article>{{/each}}
      </div>
    </div>
  </section>
<footer class="footer"></footer>
</div>
