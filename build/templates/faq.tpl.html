<div data-page="faq" class="project-page faq-page">
<header class="site-header" data-header></header>
  <section class="proj-intro">
    <div class="wrap">
      <a class="proj-back" href="#/"><span aria-hidden="true">&larr;</span> <span data-edit="proj-intro.span.0">{{proj-intro.span.0}}</span></a>
      <h1 class="proj-title" data-edit="proj-intro.proj-title.0">{{proj-intro.proj-title.0}}</h1>
      <div class="proj-copy">
        <p data-edit="proj-intro.p.0">{{proj-intro.p.0}}</p>
      </div>
    </div>
  </section>
  <section class="faq-list" aria-label="Frequently asked questions">
    <div class="wrap">{{#each faq.items}}
      <article class="faq-item" data-item="faq.items.{{@i}}">
        <h2 class="faq-q" data-edit="faq.items.{{@i}}.q">{{q}}</h2>
        <p class="faq-a" data-edit="faq.items.{{@i}}.a">{{a}}</p>
      </article>{{/each}}
      <p class="faq-foot">Still unsure whether a site is a candidate? <button type="button" class="faq-cta" data-open-contact data-edit="faq-list.faq-cta.0">{{faq-list.faq-cta.0}}</button> and describe it.</p>
    </div>
  </section>
<footer class="footer"></footer>
</div>
