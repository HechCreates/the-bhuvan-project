quote:
  - >-
    Nikhil helped us design our land, Angarike Maala (in Chamarajanagar district,
    Karnataka), so as to make it possible for us to restore and inhabit a once highly
    degraded piece of land. As an endeavour to set up a ‘living lab’, where rural citizens,
    especially youth, come to learn about community-based land use and sustainability,
    Nikhil Udupa has also facilitated us to live and work in a manner where we co-inhabit
    the place with local flora and fauna and where a sense of place predominates over that
    of living in a building.
