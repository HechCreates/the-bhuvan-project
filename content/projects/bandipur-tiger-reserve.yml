body:
  - >-
    Located along the northern boundary of the Bandipur Tiger Reserve in the Western Ghats
    (global bio-diversity hotspot), this ongoing initiative with Junglescapes Charitable
    Trust focuses on restoring the hydro-ecological integrity of a 1500 Acre degraded forest
    landscape within the critical buffer zone also a narrow elephant corridor. Years of soil
    erosion, invasive species, and disrupted drainage had weakened the natural water systems
    that sustain both wildlife and native vegetation.
  - >-
    The project aimed to rebuild the hydrological and ecological processes that define this
    landscape, restoring soil-water balance, enhancing native vegetation, and improving
    habitat connectivity. Restoration interventions include contour bunds, check dams, and
    earthen swales that slow runoff and increase groundwater recharge. These are
    complemented by the management of Invasive Alien Species (IAS) such as Lantana, and
    Assisted Natural Regeneration (ANR) using locally collected native seeds.
  - >-
    Working closely with local tribal woman SHG’s, the project combines ecological design
    and traditional stewardship. Their participation in soil and water conservation works,
    IAS management, seed collection, and site maintenance has been central to restoring the
    land’s natural resilience. Native grass and woody species regeneration and increased
    wildlife presence within the forest, Seasonal streams hold water for longer durations,
    waterholes provide relief for wildlife during extreme dry periods are signs of recovery
    and reflect the gradual return of balance.
  - >-
    Grounded in the shared philosophy of rewilding through water, soil, and community, this
    collaboration demonstrates how restoration can reconnect natural systems and livelihoods
    in one of India’s most vital ecological corridors.
