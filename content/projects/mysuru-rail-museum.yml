body:
  - >-
    The Mysuru Railway Museum, established in 1979, is one of India’s earliest outdoor
    railway museums dedicated to celebrating the nation’s rich railway heritage. Managed by
    the South Western Railways, it showcases vintage steam locomotives, railway carriages,
    inspection cars, signaling and telecommunication equipment and other historical
    artifacts. Spread across over 1,30,000 sq ft adjacent to the Mysuru railway station, the
    museum stands as a landmark of India’s engineering and cultural history.
  - >-
    By the end of 2019, the revitalization of the museum was commissioned to reimagine it as
    a vibrant public space that blends heritage, ecology and design. The project was
    developed in collaboration with the Divisional Railway Manager, Ar. Sumedha Sah, and Ar.
    Rahul M. The master plan prioritized existing mature trees conservation and were
    meticulously mapped and integrated into the design, shaping the layout of pathways,
    galleries, and exhibit placements.
  - >-
    Handling railway exhibits weighing over 60 tons required precise engineering and
    coordination, with cranes maneuvering locomotives and coaches into position without
    disturbing the site ecology. The material palette draws from Mysuru’s architectural
    heritage, local granite, Athangudi tiles, oxide flooring, and polished wooden furniture
    evoke the city’s timeless character. Today, the museum attracts 300–400 visitors daily,
    functioning as both a cultural landmark and a restored urban open space, allowing public
    engagement with India’s rail legacy in a biodiverse and climate-sensitive setting.
