title: Chairman's Bungalow Landscape
subtitle: Nilgiris
location: Nilgiris
status: Completed
link: null
body:
  - >-
    The landscape design of the Chairman’s Bungalow within the Nilgiris, where mist- laden
    tea covered hills and shola forests frame a distinctive agro-ecological setting. The
    design approach in collaboration with studio souk and Fuzzy boundaries draws upon
    principles of sustainability, aesthetics and ecological sensitivity, aiming to create a
    landscape that integrates seamlessly with its natural surroundings while enriching the
    sensory experience of daily life.
  - >-
    Guided by the heritage character of the bungalow and the site’s topography, the external
    spaces are carefully crafted around viewsheds, seasonal variation, and the rhythm of
    sunrise and sunset. The entire roof and surface runoff water is managed through a series
    of passive, non-intrusive water conservation systems, enhancing both functionality and
    resilience. The planting palette draws from endemic species of shola’s, Montane
    grasslands and the Western Ghats, reviving native biodiversity while creating an
    immersive, layered landscape experience. The project aspires to become a demonstrative
    model of sustainable design within the ’ unique geo-climatic context - where heritage,
    ecology, and contemporary design coexist in harmony.
