body:
  - >-
    At The Bhu.Van Project studio, our architectural approach is grounded in minimalism,
    rootedness and sensory engagement. We design spaces that breathe, where light and
    shadow, texture, material, craft and culture shape the experience of place. Each project
    seeks to reveal the essence of local materials, celebrating the tactile warmth of stone,
    brick, wood and earth.
  - >-
    Our process emphasizes resource efficiency, passive comfort and contextual design,
    creating buildings that belong to their climate and culture. By integrating local art,
    craft traditions and community knowledge, we create architecture that is both
    aesthetically refined and ecologically responsible. The outcome is a quiet, timeless
    architecture that supports life, evokes emotion, and endures change.
