# The editable content of the projects page.
#
# Generated by build/extract-page.mjs from the page's own markup, and from
# now on the source of truth for it. build/templates/projects.tpl.html is that
# same markup with these values replaced by tokens; build/gen-pages.mjs puts
# the two back together. Edit here, or through /admin/, never in the HTML.
#
# Names come from the markup's own structure -- section, then class, then
# position -- so they can be read, but they are not promises: re-extracting
# after a layout change can rename them.

