faq:
  items:
    - q: What does &ldquo;Bhu.Van&rdquo; mean?
      a: >-
        The name is rooted in the Sanskrit word <em>Bhuvan</em>, meaning the world &mdash; the realm
        between sky and earth. The studio takes its scope from that idea: designing with land, water
        and the living systems between them, rather than treating a site as a surface to be
        decorated.
    - q: What is ecological restoration?
      a: >-
        Ecological restoration is the practice of assisting the recovery of a degraded ecosystem
        &mdash; rebuilding its hydrology, biodiversity and soil health until it can sustain itself
        again. At The Bhu.Van Project it means weaving restoration science together with design, on
        degraded landscapes across South India.
    - q: What does The Bhu.Van Project do?
      a: >-
        The Bhu.Van Project is an ecological restoration and landscape architecture studio based in
        Bengaluru. It works on habitat restoration, watershed management, regenerative farm
        landscapes and context-responsive architecture, helping places regain strength through
        thoughtful planning and field-based experience.
    - q: Where is the studio based, and where does it work?
      a: >-
        The studio is based in Bengaluru, Karnataka, and works across India. Projects have run from
        the high-altitude valleys of Ladakh to the tea gardens of the Nilgiris, and from the remote
        forests of Arunachal Pradesh to the urban landscapes of Ahmedabad.
    - q: Who founded The Bhu.Van Project?
      a: >-
        Nikhil Udupa, a landscape architect and ecological restoration practitioner with over
        fourteen years of experience in research-based spatial planning and sustainable design. His
        expertise covers nature-based solutions, watershed and natural resource management, wildlife
        habitat design, master planning and disaster-resilient regional planning.
    - q: What services does the studio offer?
      a: >-
        Five practices: ecological restoration, landscape architecture, resilient watershed
        management and land master planning, sustainable architecture, and academic engagement. Most
        projects draw on several at once, because a degraded landscape rarely has only one thing
        wrong with it.
    - q: What is the difference between landscape architecture and ecological restoration?
      a: >-
        Landscape architecture designs how a place is used and experienced &mdash; biodiverse,
        barrier-free and regenerative spaces rooted in local material, water and culture. Ecological
        restoration repairs how a place <em>functions</em>, rebuilding hydrology, soil and habitat.
        The studio treats them as one continuous practice rather than two services.
    - q: What kinds of sites does the studio work on?
      a: >-
        Fragile ecosystems and protected areas, productive estates and farms, institutional
        campuses, community commons and urban developments. Scales run from a few acres to entire
        watersheds &mdash; from a 60-acre farm landscape in Rayalaseema to 1,500 acres of forest in
        the Bandipur Tiger Reserve buffer.
    - q: How does the studio approach a project?
      a: >-
        Every site is treated as a living system with its own memory and potential. The approach is
        guided by rootedness, resilience and renewal, integrating scientific research, local
        knowledge and participatory processes to arrive at design that is specific to the place
        rather than applied to it.
    - q: How do I start a project with The Bhu.Van Project?
      a: >-
        Use the Get in Touch form anywhere on this site, or write to <a class="faq-mail"
        href="mailto:nikhiludupa4@gmail.com">nikhiludupa4@gmail.com</a>. It helps to include where
        the site is, roughly how large it is, and what you have noticed going wrong with it &mdash;
        erosion, water loss, invasive species, or simply land that no longer holds life.
