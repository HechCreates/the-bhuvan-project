geo:
  p:
    '0': >-
      From the high-altitude valleys of Ladakh to the tea gardens of the Nilgiris, and from the
      remote forests of Arunachal Pradesh to the dynamic urban landscapes of Ahmedabad, our work
      experience spans the ecological and cultural diversity of India.
    '1': >-
      Based in Bengaluru, The Bhu.Van Project engages with landscapes across varied climates,
      geographies and communities, from fragile ecosystems and protected areas to productive
      estates, institutional campuses, and urban developments. Each project is an opportunity to
      understand the living systems of soil, water, vegetation and people, and to design with them.
    '2': >-
      Our experience bridges disciplines of landscape architecture, ecological restoration,
      watershed management, sustainable design and climate adaptation. Working across scales from a
      few acres to entire watersheds, we integrate scientific research, local knowledge, and
      participatory processes to evolve site-specific, resilient, and regenerative design solutions.
  img:
    '0':
      src: images/home/india-map.png
      alt: A dotted map of India marking the studio's project sites, concentrated in the south.
