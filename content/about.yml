philo:
  p:
    '0': >-
      The Bhu.Van Project is where design, ecology and resilience meet. Science shows that many
      natural systems are nearing climate tipping points, and this makes climate-adaptive,
      nature-based solutions more important than ever.
    '1': >-
      We work in landscape architecture, ecological restoration and sustainable design, helping
      places regain strength through thoughtful planning and field-based experience. Our approach is
      guided by rootedness, resilience and renewal. We see every site as a living system with its
      own memory and potential.
    '2': >-
      For us, minimalism means focusing on what truly matters, and helping support landscapes that
      can thrive in a changing climate.
