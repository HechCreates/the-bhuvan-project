# The editable content of the about page.
#
# Generated by build/extract-page.mjs from the page's own markup, and from
# now on the source of truth for it. build/templates/about.tpl.html is that
# same markup with these values replaced by tokens; build/gen-pages.mjs puts
# the two back together. Edit here, or through /admin/, never in the HTML.
#
# Names come from the markup's own structure -- section, then class, then
# position -- so they can be read, but they are not promises: re-extracting
# after a layout change can rename them.

page:
  modal-para:
    '0': >-
      A Landscape Architect and ecological restoration practitioner with 14+ years of experience in
      research-based spatial planning and sustainable design. His work spans a wide range of
      landscapes across India, integrating ecological thinking with cultural sensitivity to design
      resilient and inclusive spaces.
    '1': >-
      His core expertise includes nature-based solutions, watershed and natural resource management,
      ecological restoration, wildlife habitat design, spatial design, master planning and
      disaster-resilient regional planning. He has collaborated with communities, government bodies,
      institutions, NGOs, and interdisciplinary teams to implement regenerative, context-sensitive
      design strategies.
    '2': >-
      As a visiting faculty at leading institutions, Nikhil actively contributes to academic
      discourse and knowledge sharing. His passion for nature, community engagement, and hands-on
      implementation drives his commitment to preserving ecological and cultural heritage through
      landscape architecture. Outside of work, he is a naturalist and avid traveller, with interests
      in birding, photography, trekking, yoga, boxing and collecting minerals and fossils.
    '3': >-
      An architect and educator working at the intersection of climate change, the built environment
      and the ways in which people and places respond to a changing environment. Her work focuses on
      climate adaptation in urban areas, climate change and migration and inclusive spatial
      planning, with a particular interest in the ways vulnerable communities experience and respond
      to climate impacts.
    '4': >-
      With a background in sustainable architecture, she is also interested in landscape
      restoration, vernacular and heritage documentation and energy-efficient design. Across these
      areas, her work explores how environmental conditions, local knowledge, and spatial
      interventions shape the ways in which people and places adapt to change.
  modal-title:
    '0': Nikhil Udupa
    '1': Shilpa Shirish
  modal-eyebrow:
    '0': Founder
    '1': Co-founder
