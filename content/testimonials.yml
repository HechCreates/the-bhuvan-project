tst:
  cards:
    - lede: >-
        It was great working with Nikhil. He brings a rare balance of ecological depth and design
        clarity, he reads the landscape carefully, respects local culture and real-world
        constraints, and then translates the vision into practical, phase-wise actions that teams
        can actually implement on ground. He also brings extraordinary attention to detail in the
        drawings making the design intent unambiguous and execution-ready.
      body:
        - >-
          It was great working with Nikhil. He brings a rare balance of ecological depth and design
          clarity, he reads the landscape carefully, respects local culture and real-world
          constraints, and then translates the vision into practical, phase-wise actions that teams
          can actually implement on ground. He also brings extraordinary attention to detail in the
          drawings making the design intent unambiguous and execution-ready.
      more: Read the full testimonial from Mahesh Basavanna
      silWidth: '128'
      silHeight: '420'
      silImage: images/testimonials/mcd-berls.webp
      silStyle: '--sil-x:80.5%;--sil-ar:0.305;--sil-min:251px'
      silAlt: A standing figure
      name: Mahesh Basavanna
      role: Director, CEO, McD Berls
    - lede: >-
        Working with Nikhil has been a truly enriching experience. He helped us transform our
        12-acre dry farmland on the edge of a reserve forest into a living, sustainable landscape.
        From the survey to the masterplan, his approach was deeply thoughtful and rooted in ecology.
        His understanding of water and ecology changed the way our land holds and moves water. What
        we appreciated most was his holistic thinking. He guided us toward native species, used
        local materials, and designed our farm structures to work with the land rather than against
        it. The mud-block cabin, stone cowshed and erosion-control works all grew out of what the
        site itself offered. Nikhil is not just a skilled landscape architect but someone who
        genuinely cares for the land and its long-term health. We’re grateful for his clarity,
        sensitivity and commitment, and wholeheartedly recommend him to anyone looking to build a
        resilient and meaningful project.
      body:
        - >-
          Working with Nikhil has been a truly enriching experience. He helped us transform our
          12-acre dry farmland on the edge of a reserve forest into a living, sustainable landscape.
          From the survey to the masterplan, his approach was deeply thoughtful and rooted in
          ecology. His understanding of water and ecology changed the way our land holds and moves
          water.
        - >-
          What we appreciated most was his holistic thinking. He guided us toward native species,
          used local materials, and designed our farm structures to work with the land rather than
          against it. The mud-block cabin, stone cowshed and erosion-control works all grew out of
          what the site itself offered.
        - >-
          Nikhil is not just a skilled landscape architect but someone who genuinely cares for the
          land and its long-term health. We’re grateful for his clarity, sensitivity and commitment,
          and wholeheartedly recommend him to anyone looking to build a resilient and meaningful
          project.
      more: Read the full testimonial from Raja Bhat
      silWidth: '288'
      silHeight: '420'
      silImage: images/testimonials/raja-bhat.webp
      silStyle: '--sil-x:17%;--sil-ar:0.686;--sil-min:205px'
      silAlt: A farmer tending a plant
      name: Raja Bhat
      role: Organic farm owner
    - lede: >-
        Nikhil helped us design our land, Angarike Maala (in Chamarajanagar district, Karnataka), so
        as to make it possible for us to restore and inhabit a once highly degraded piece of land.
        As an endeavour to set up a ‘living lab’, where rural citizens, especially youth, come to
        learn about community-based land use and sustainability, Nikhil Udupa has also facilitated
        us to live and work in a manner where we co-inhabit the place with local flora and fauna and
        where a sense of place predominates over that of living in a building.
      body:
