# The editable content of the home page.
#
# Generated by build/extract-page.mjs from the page's own markup, and from
# now on the source of truth for it. build/templates/home.tpl.html is that
# same markup with these values replaced by tokens; build/gen-pages.mjs puts
# the two back together. Edit here (or through /admin/), never in the HTML.

hero:
  tags:
    - label: Design
    - label: Ecology
    - label: Resilience
  statement: >-
    The Bhu.Van Project is an evolving design practice exploring the deep relationship between <span
    class="hero-key">people, place and ecology.</span>
  lede: >-
    Through this lens, the studio seeks to <span class="hero-key">rewild, restore, and
    reimagine</span> landscapes that sustain life.
  eyebrow: Ecological restoration &middot; Landscape architecture &middot; Bengaluru
  image:
    src: images/site/hero.jpg
    alt: >-
      A wetland with many migratory birds — painted stork, grey heron and bar-headed geese — feeding
      among the reeds, in clear natural light.
