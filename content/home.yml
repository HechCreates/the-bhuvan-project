meaning:
  text: >-
    Rooted in the Sanskrit word &ldquo;<span class="bhu">Bhuvan</span>&rdquo;, meaning the world,
    the realm between sky and earth
aboutTeaser:
  eyebrow: About us
  statement: >-
    The Bhu.Van Project is where design, ecology and resilience meet. We see every site as a living
    system, with its own memory and potential. Working across landscape architecture, ecological
    restoration and sustainable design, we help places regain strength through thoughtful planning
    and years of on-site expertise. Every project is guided by rootedness, resilience and renewal.
  linkLabel: About us
  map:
    src: images/home/india-map.png
    alt: >-
      A dotted map of India marking the studio’s project sites across the country, concentrated in
      the south.
    caption: Our Geographical footprint and extent
practices:
  heading: What we do
  items:
    ecological-restoration:
      name: Ecological Restoration
      description: >-
        Assisting the recovery of degraded ecosystems across South India, weaving restoration
        science with design to rebuild hydrology, biodiversity and soil health.
      image: images/home/practice-ecological-restoration.webp
      imageAlt: A restored forest stream running clear through dense native vegetation in the Western Ghats.
      moreLabel: 'Read the full scope '
    landscape-architecture:
      name: Landscape Architecture
      description: >-
        Biodiverse, barrier-free and regenerative landscapes rooted in local material, water, and
        the cultural context of each site.
      image: images/home/practice-landscape-architecture.webp
      imageAlt: >-
        A rewilded garden of native flowering plants and pollinators beside a heritage brick
        structure.
      moreLabel: 'Read the full scope '
    watershed-management:
      name: Resilient Watershed Management &amp; Land Master Planning
      description: >-
        Reimagining land as a living system that captures, stores and circulates water, watershed
        masterplans for farms, estates, campuses and community commons.
      image: images/home/practice-watershed-management.webp
      imageAlt: >-
        A restored farm pond fringed with grasses and native planting, holding water within an
        agricultural landscape.
      moreLabel: 'Read the full scope '
    sustainable-architecture:
      name: Sustainable Architecture
      description: >-
        Buildings that belong to their climate and culture, rooted in the vernacular traditions of
        South India, quiet and timeless.
      image: images/home/sustainable-architecture-cover.webp
      imageAlt: >-
        A contemporary building in exposed local brick with bamboo-patterned windows, set in a dry
        Deccan landscape.
      moreLabel: 'Read the full scope '
    academic-engagement:
      name: Academic Engagement
      description: >-
        Lectures, field studios and hands-on workshops with design institutions, inviting students
        to work with natural systems rather than against them.
      image: images/home/practice-academic-engagement.webp
      imageAlt: >-
        Students and practitioners gathered around a facilitator at a hands-on landscape design
        field workshop.
      moreLabel: 'Read the full scope '
