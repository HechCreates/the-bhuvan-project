  modal-para:
    '0': >-
      Ecological restoration lies at the heart of our practice, an evolving process of assisting the
      recovery of ecosystems that have been degraded, damaged, or destroyed. Our approach combines
      the science of restoration ecology with the sensitivity of design, rooted in a deep
      understanding of landscape processes, cultural relationships, and community stewardship.
    '1': >-
      We work across South India's major eco-regions, from the dry deciduous forests and savannas of
      the Deccan Plateau to the moist forests of the South Western Ghats, wetlands, and working
      agricultural lands, restoring hydrology, biodiversity, and soil health while strengthening
      local ecological and community resilience.
    '2': >-
      Each project is grounded in field research, adaptive management, and partnerships with local
      communities and field experts, aligning ecological recovery with social and climate adaptation
      goals.
    '3': >-
      Our ecological restoration philosophy emphasises rewilding through water, soil, flora, and
      community, creating living landscapes that regenerate themselves over time and nurture
      coexistence between people and nature.
    '4': >-
      We craft landscape architecture solutions that enhance both the ecological integrity and
      experiential quality of place. Each project draws upon local materials, nature-based
      solutions, and the cultural context of the site, creating spaces that are barrier-free,
      biodiverse, and regenerative.
    '5': >-
      Our focus lies in reviving soil and mycelial health, supporting pollinators and frugivores,
      and restoring ecological functions while celebrating the sensory beauty and productivity of
      the land. Our approach integrates hydro-ecological landscape design, where water management,
      ecological restoration, permaculture, and sustainable land use converge.
    '6': >-
      We work across scales, from site planning and soil and water conservation to the synthesis of
      scientific and traditional knowledge systems. Projects emphasise climate-adaptive design,
      productive landscapes, and biodiversity, framed within a vision of borrowed landscapes that
      visually and functionally connect to their larger ecosystems.
    '7': >-
      Through site-based observation, design dialogue, and collaboration, we create living
      landscapes that nurture water security, soil vitality, and long-term ecological balance,
      resilient systems that evolve with time and change.
    '8': >-
      Across landscapes shaped by agriculture, forestry, and settlement, resilient watershed
      management forms the foundation for climate adaptation and ecological renewal. Our approach
      integrates hydrology, ecology, and design to reimagine land as a living system, one that
      captures, stores, and circulates water naturally.
    '9': >-
      Working with individual farms, institutions, corporate and spiritual campuses, estates,
      community commons, and conservation agencies, we develop watershed masterplans that combine
      field-based knowledge, scientific understanding, and sustainable land use design.
    '10': >-
      Each project aims to restore watershed function, enhance soil, water, and food security,
      regenerate biodiversity, and create resilient systems that support both livelihood and
      ecology.
    '11': >-
      At The Bhu.Van Project studio, our architectural approach is grounded in minimalism,
      rootedness, and sensory engagement. We design spaces that breathe, where light and shadow,
      texture, material, craft, and culture shape the experience of place. Each project seeks to
      reveal the essence of local materials, celebrating the tactile warmth of stone, brick, wood,
      and earth.
    '12': >-
      Our process emphasises resource efficiency, passive design, and contextual design, creating
      buildings that belong to their climate and culture. By integrating local art, craft
      traditions, and community knowledge, we create sustainable architecture that is both
      aesthetically refined and ecologically responsible.
    '13': >-
      Rooted in vernacular architecture principles of South India, the outcome is a quiet, timeless
      architecture that supports life, evokes emotion, and endures change.
    '14': >-
      We enjoy collaborating with architectural and design institutions to explore how ecology and
      culture shape the landscapes around us. Through lectures, field studios, and hands-on
      landscape design workshops, we invite students and practitioners to slow down, observe, and
      work with natural systems rather than against them.
    '15': >-
      Our recent workshop on Hydro-Ecological Landscape Design is one example of how we bring these
      ideas to life, encouraging curiosity, care, and a deeper connection with the living world.
  modal-sub:
    '0': Designing landscapes that heal, engage, and adapt.
    '1': Minimalist, Material-First &amp; Climatically Responsive
